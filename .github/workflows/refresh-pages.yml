name: Golden Shelf Refresh Pages

on:
  workflow_dispatch: # Manual only: rebuilds derived pages from data/books.json (no new picks)

permissions:
  contents: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  refresh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate Book Pages
        env:
          SITE_URL: https://novicelab.org
        run: |
          python3 generate_pages.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add books sitemap.xml new.html
          git diff --staged --quiet || git commit -m "🔄 Golden Shelf: refresh book pages for $(date +%Y-%m-%d)"
          git push
