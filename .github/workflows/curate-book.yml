name: Golden Shelf Book Curation

on:
  schedule:
    - cron: '0 8 * * *' # Adds new picks to the collection over time (not surfaced in the UI)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curate-book
  cancel-in-progress: false

jobs:
  curate-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Book Curation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 script.py

      - name: Generate Book Pages
        env:
          SITE_URL: https://novicelab.org
        run: |
          python3 generate_pages.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/books.json data/history.json books sitemap.xml
          git diff --staged --quiet || git commit -m "📚 Golden Shelf: add curated pick for $(date +%Y-%m-%d)"
          git push
